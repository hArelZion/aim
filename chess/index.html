<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231a1a2e%22/><path d=%22M20 20h60v60H20z%22 fill=%22%23e94560%22/><path d=%22M20 20l60 60M80 20l-60 60%22 stroke=%22%2316213e%22 stroke-width=%225%22/></svg>">
  <title>Chess</title>
  <style>
    @import url('style.css');
  </style>
</head>
<body>
  <div id="app">
    <div id="start-screen" class="screen">
      <h1><span class="chess-logo">♟️</span> Chess</h1>
      <p class="subtitle">Play chess anytime, anywhere</p>
      <div class="button-group">
        <button id="play-robot" class="big-button">Play vs Robot</button>
        <button id="two-players" class="big-button">Two Players (same phone)</button>
        <button id="continue" class="big-button hidden">Continue</button>
      </div>
      <div id="robot-options" class="hidden">
        <div class="options-group">
          <label>Level:</label>
          <div class="level-selector">
            <button class="level-btn" data-level="1">Beginner</button>
            <button class="level-btn" data-level="2">Casual</button>
            <button class="level-btn active" data-level="3">Club</button>
            <button class="level-btn" data-level="4">Strong</button>
            <button class="level-btn" data-level="5">Master</button>
          </div>
        </div>
        <div class="options-group">
          <label>Color:</label>
          <div class="color-selector">
            <button class="color-btn active" data-color="w">White</button>
            <button class="color-btn" data-color="b">Black</button>
            <button class="color-btn" data-color="r">Random</button>
          </div>
        </div>
        <button id="start-robot-game" class="big-button">Start</button>
      </div>
    </div>

    <div id="game-screen" class="screen hidden">
      <div id="top-player" class="player-bar">
        <div class="player-info">
          <div class="avatar">
            <div class="avatar-piece"></div>
          </div>
          <span class="player-name">Black</span>
          <div class="captured-pieces"></div>
          <span class="material-advantage">+0</span>
        </div>
      </div>
      <div id="board-container">
        <div id="board"></div>
        <div id="coordinates">
          <div class="files"></div>
          <div class="ranks"></div>
        </div>
      </div>
      <div id="bottom-player" class="player-bar">
        <div class="player-info">
          <div class="avatar">
            <div class="avatar-piece"></div>
          </div>
          <span class="player-name">White</span>
          <div class="captured-pieces"></div>
          <span class="material-advantage">+0</span>
        </div>
      </div>
      <div id="game-controls">
        <div id="status-line">Your move</div>
        <div class="button-group">
          <button id="undo-btn" class="game-button" aria-label="Undo last move">Undo</button>
          <button id="flip-btn" class="game-button" aria-label="Flip board">Flip</button>
          <button id="new-game-btn" class="game-button" aria-label="New game">New game</button>
          <button id="menu-btn" class="game-button" aria-label="Menu">Menu</button>
        </div>
      </div>
      <div id="move-list-container">
        <button id="toggle-move-list" class="toggle-button" aria-label="Toggle move list">Moves ▼</button>
        <div id="move-list" class="hidden"></div>
      </div>
    </div>

    <div id="promotion-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Promote pawn to:</h2>
        <div class="promotion-options"></div>
      </div>
    </div>

    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="game-result"></h2>
        <p id="game-reason"></p>
        <div class="button-group">
          <button id="rematch-btn" class="big-button">Rematch</button>
          <button id="menu-btn-modal" class="big-button">Menu</button>
        </div>
      </div>
    </div>

    <button id="sound-toggle" class="sound-toggle" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24">
        <path d="M14.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        <path d="M19 12c0 1.66-1.34 3-3 3v-6c1.66 0 3 1.34 3 3z"/>
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
      </svg>
    </button>
  </div>

  <script src="pieces.js"></script>
  <script src="chess-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
