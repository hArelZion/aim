<!doctype html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-title" content="Tic Tac Toe">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe — Arcade Neon Edition</title>
  <meta name="description" content="Experience retro arcade Tic Tac Toe with glowing neon aesthetics, smart AI, live scores, and customizable symbols!">
  <meta name="atlas-build" content="w3u8t2ptcnvcxx3mc3kx">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #1e1b4b;
      --bg-darker: #131135;
      --cream: #f5f0e1;
      --white: #ffffff;
      --coral: #ff6f61;
      --yellow: #ffd166;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff007f;
      --border-glow: 0 0 15px rgba(255, 111, 97, 0.4);
      --font-display: 'Press Start 2P', monospace;
      --font-body: 'Space Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--cream);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Typography Clamp */
    h1 { font-size: clamp(1.8rem, 4vw, 3.2rem); font-family: var(--font-display); }
    h2 { font-size: clamp(1.3rem, 3vw, 2.2rem); font-family: var(--font-display); }
    h3 { font-size: clamp(1rem, 2vw, 1.4rem); font-family: var(--font-display); }

    /* Focus styling for accessibility */
    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
    }

    /* Header & Nav */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(19, 17, 53, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 3px solid var(--coral);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--white);
    }

    .brand span {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: var(--yellow);
      text-shadow: 2px 2px var(--coral);
    }

    /* Hero Section */
    #hero {
      position: relative;
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      background: linear-gradient(180deg, rgba(30,27,75,0.7) 0%, rgba(19,17,53,0.95) 100%),
                  url('https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/DFC_0797_Close-up_of_a_row_of_retro_arcade_game_joysticks_glowing_with_neon_blue_and_pink_lights.jpg/1280px-DFC_0797_Close-up_of_a_row_of_retro_arcade_game_joysticks_glowing_with_neon_blue_and_pink_lights.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail');
      background-size: cover;
      background-position: center;
      border-bottom: 4px solid var(--coral);
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .hero-title {
      color: var(--white);
      text-shadow: 4px 4px 0px var(--coral), 8px 8px 0px var(--bg-darker);
      line-height: 1.3;
    }

    .hero-tagline {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--yellow);
      background: rgba(19, 17, 53, 0.8);
      padding: 0.5rem 1rem;
      border: 2px dashed var(--coral);
      border-radius: 4px;
    }

    .btn-arcade {
      font-family: var(--font-display);
      font-size: 1rem;
      padding: 1.2rem 2.5rem;
      color: var(--bg-darker);
      background: var(--yellow);
      border: none;
      box-shadow: 6px 6px 0px var(--coral);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-block;
      text-transform: uppercase;
      margin-top: 1rem;
    }

    .btn-arcade:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px var(--coral);
      background: var(--white);
    }

    .btn-arcade:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0px var(--coral);
    }

    /* Main Container */
    main {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }

    /* Scoreboard */
    #score {
      background: var(--bg-darker);
      border: 3px solid var(--yellow);
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: var(--border-glow);
    }

    .score-title {
      text-align: center;
      color: var(--coral);
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      text-align: center;
    }

    .score-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem 0.5rem;
      border: 2px solid var(--coral);
      border-radius: 4px;
    }

    .score-label {
      font-size: 0.8rem;
      color: var(--cream);
      display: block;
      margin-bottom: 0.5rem;
    }

    .score-val {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: var(--yellow);
    }

    /* Game Board Section */
    #board-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .status-banner {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: var(--neon-cyan);
      text-align: center;
      min-height: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-darker);
      width: 100%;
      max-width: 450px;
      padding: 0.75rem;
      border: 2px solid var(--coral);
      border-radius: 4px;
    }

    .grid-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 450px;
      aspect-ratio: 1 / 1;
      background: var(--coral);
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(255, 111, 97, 0.3);
    }

    .cell {
      background: var(--bg-darker);
      border: none;
      border-radius: 4px;
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 4rem);
      color: var(--yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(:disabled) {
      background: #25215a;
      transform: scale(0.98);
    }

    .cell.x-mark {
      color: var(--coral);
      text-shadow: 0 0 10px rgba(255, 111, 97, 0.6);
    }

    .cell.o-mark {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }

    .cell.winning {
      background: var(--yellow) !important;
      color: var(--bg-darker) !important;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    /* Controls */
    #controls {
      background: var(--bg-darker);
      padding: 2rem;
      border-radius: 8px;
      border: 2px solid var(--coral);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      width: 100%;
    }

    .ctrl-btn {
      font-family: var(--font-body);
      font-weight: 700;
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: 2px solid var(--yellow);
      color: var(--yellow);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .ctrl-btn:hover, .ctrl-btn.active {
      background: var(--yellow);
      color: var(--bg-darker);
    }

    .ctrl-btn.reset-btn {
      border-color: var(--coral);
      color: var(--coral);
    }

    .ctrl-btn.reset-btn:hover {
      background: var(--coral);
      color: var(--white);
    }

    /* Reveal animations */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Footer */
    footer {
      margin-top: auto;
      background: var(--bg-darker);
      border-top: 3px solid var(--coral);
      padding: 2.5rem 1.5rem 1.5rem;
      text-align: center;
      font-size: 0.9rem;
    }

    .footer-content {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer-links a {
      color: var(--yellow);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .photo-credit {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .btn-arcade, .cell {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation / Header -->
  <header>
    <a href="#" class="brand">
      <img src="logo.svg" alt="" width="36" height="36">
      <span>TIC TAC TOE</span>
    </a>
  </header>

  <!-- Hero Section -->
  <section id="hero">
    <div class="hero-content">
      <h1 class="hero-title">NEON GRID SHOWDOWN</h1>
      <p class="hero-tagline">CLASSIC 3x3 TACTICS MEET RETRO ARCADE VIBES</p>
      <a href="#board-section" class="btn-arcade">PRESS START</a>
    </div>
  </section>

  <main>
    <!-- Live Scoreboard -->
    <section id="score" class="reveal" aria-label="Scoreboard">
      <h2 class="score-title">PLAYER TALLY</h2>
      <div class="score-grid">
        <div class="score-card">
          <span class="score-label">PLAYER (X)</span>
          <span class="score-val" id="score-x">0</span>
        </div>
        <div class="score-card">
          <span class="score-label">DRAWS</span>
          <span class="score-val" id="score-draws">0</span>
        </div>
        <div class="score-card">
          <span class="score-label" id="label-o">OPPONENT (O)</span>
          <span class="score-val" id="score-o">0</span>
        </div>
      </div>
    </section>

    <!-- Game Board -->
    <section id="board-section" class="reveal">
      <div class="status-banner" id="status" aria-live="polite">PLAYER X'S TURN</div>
      
      <div class="grid-board" id="board" role="grid" aria-label="Tic Tac Toe Board">
        <button class="cell" data-index="0" aria-label="Cell 1,1"></button>
        <button class="cell" data-index="1" aria-label="Cell 1,2"></button>
        <button class="cell" data-index="2" aria-label="Cell 1,3"></button>
        <button class="cell" data-index="3" aria-label="Cell 2,1"></button>
        <button class="cell" data-index="4" aria-label="Cell 2,2"></button>
        <button class="cell" data-index="5" aria-label="Cell 2,3"></button>
        <button class="cell" data-index="6" aria-label="Cell 3,1"></button>
        <button class="cell" data-index="7" aria-label="Cell 3,2"></button>
        <button class="cell" data-index="8" aria-label="Cell 3,3"></button>
      </div>
    </section>

    <!-- Controls -->
    <section id="controls" class="reveal" aria-label="Game Controls">
      <h3>GAME SETTINGS</h3>
      <div class="controls-group">
        <button class="ctrl-btn active" id="mode-2p">2 PLAYERS</button>
        <button class="ctrl-btn" id="mode-ai">VS AI (CPU)</button>
      </div>
      <div class="controls-group">
        <button class="ctrl-btn reset-btn" id="reset-btn">RESET MATCH</button>
        <button class="ctrl-btn reset-btn" id="clear-score-btn">CLEAR SCORES</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; 2025 Arcade Neon Edition. Built with modern web standards.</p>
      <div class="footer-links">
        <a href="#hero">Back to Top</a>
        <a href="https://github.com" target="_blank" rel="noopener">Source Code</a>
      </div>
      <div class="photo-credit">
        Photos: Wikimedia Commons
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Game state variables
      let boardState = ['', '', '', '', '', '', '', '', ''];
      let currentPlayer = 'X';
      let isGameActive = true;
      let vsAI = false;
      let scores = { X: 0, O: 0, draws: 0 };

      // DOM Elements
      const boardEl = document.getElementById('board');
      const cells = document.querySelectorAll('.cell');
      const statusEl = document.getElementById('status');
      const scoreXEl = document.getElementById('score-x');
      const scoreOEl = document.getElementById('score-o');
      const scoreDrawsEl = document.getElementById('score-draws');
      const labelOEl = document.getElementById('label-o');
      
      const mode2pBtn = document.getElementById('mode-2p');
      const modeAiBtn = document.getElementById('mode-ai');
      const resetBtn = document.getElementById('reset-btn');
      const clearScoreBtn = document.getElementById('clear-score-btn');

      const WINNING_COMBOS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
        [0, 4, 8], [2, 4, 6]             // Diagonals
      ];

      // Handle Cell Click
      function handleCellClick(e) {
        const cell = e.target;
        const index = parseInt(cell.getAttribute('data-index'));

        if (boardState[index] !== '' || !isGameActive) return;

        makeMove(index, currentPlayer);

        if (isGameActive && vsAI && currentPlayer === 'O') {
          setTimeout(aiMove, 400);
        }
      }

      function makeMove(index, player) {
        boardState[index] = player;
        const cell = cells[index];
        cell.textContent = player;
        cell.classList.add(player === 'X' ? 'x-mark' : 'o-mark');
        cell.setAttribute('disabled', 'true');

        checkResult();
      }

      function checkResult() {
        let roundWon = false;
        let winningCombo = [];

        for (let i = 0; i < WINNING_COMBOS.length; i++) {
          const [a, b, c] = WINNING_COMBOS[i];
          if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
            roundWon = true;
            winningCombo = [a, b, c];
            break;
          }
        }

        if (roundWon) {
          statusEl.textContent = `PLAYER ${currentPlayer} WINS!`;
          isGameActive = false;
          highlightWinningCells(winningCombo);
          scores[currentPlayer]++;
          updateScoreDisplay();
          return;
        }

        if (!boardState.includes('')) {
          statusEl.textContent = "IT'S A DRAW!";
          isGameActive = false;
          scores.draws++;
          updateScoreDisplay();
          return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        statusEl.textContent = vsAI && currentPlayer === 'O' ? "CPU IS THINKING..." : `PLAYER ${currentPlayer}'S TURN`;
      }

      function highlightWinningCells(combo) {
        combo.forEach(idx => cells[idx].classList.add('winning'));
      }

      function aiMove() {
        if (!isGameActive) return;

        // Basic AI logic: Win, Block, or Pick Random
        let emptyIndices = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);

        // 1. Check if AI can win
        let move = findBestMove('O');
        // 2. Block Player
        if (move === null) move = findBestMove('X');
        // 3. Take center if available
        if (move === null && boardState[4] === '') move = 4;
        // 4. Random available move
        if (move === null) {
          move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        }

        if (move !== undefined && move !== null) {
          makeMove(move, 'O');
        }
      }

      function findBestMove(player) {
        for (let combo of WINNING_COMBOS) {
          const [a, b, c] = combo;
          const values = [boardState[a], boardState[b], boardState[c]];
          if (values.filter(v => v === player).length === 2 && values.filter(v => v === '').length === 1) {
            return combo[values.indexOf('')];
          }
        }
        return null;
      }

      function resetGame() {
        boardState = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        isGameActive = true;
        statusEl.textContent = "PLAYER X'S TURN";

        cells.forEach(cell => {
          cell.textContent = '';
          cell.className = 'cell';
          cell.removeAttribute('disabled');
        });
      }

      function updateScoreDisplay() {
        scoreXEl.textContent = scores.X;
        scoreOEl.textContent = scores.O;
        scoreDrawsEl.textContent = scores.draws;
      }

      // Event Listeners
      cells.forEach(cell => cell.addEventListener('click', handleCellClick));

      resetBtn.addEventListener('click', resetGame);

      clearScoreBtn.addEventListener('click', () => {
        scores = { X: 0, O: 0, draws: 0 };
        updateScoreDisplay();
        resetGame();
      });

      mode2pBtn.addEventListener('click', () => {
        if (vsAI) {
          vsAI = false;
          mode2pBtn.classList.add('active');
          modeAiBtn.classList.remove('active');
          labelOEl.textContent = 'PLAYER (O)';
          resetGame();
        }
      });

      modeAiBtn.addEventListener('click', () => {
        if (!vsAI) {
          vsAI = true;
          modeAiBtn.classList.add('active');
          mode2pBtn.classList.remove('active');
          labelOEl.textContent = 'CPU (O)';
          resetGame();
        }
      });

      // Reveal on scroll observer
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    });
  </script>
</body>
</html>
