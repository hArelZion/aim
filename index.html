<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIM</title>
<meta name="apple-mobile-web-app-title" content="AIM">
<meta name="theme-color" content="#3d4046">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // Launched from the home screen (saved URL carries ?launch=1, or web-app mode): go straight to the chat.
  var CHAT = "https://claude.ai/artifact/1H9qqRjCkBnbn1rjvxju5d";
  var standalone = navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (/[?&]launch=1/.test(location.search) || standalone) location.replace(CHAT);
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: #3d4046; color: #fff; font: 16px/1.6 -apple-system, "Segoe UI", sans-serif; text-align: center;
  }
  main { display: grid; gap: 18px; justify-items: center; max-width: 340px; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 8px 24px rgb(0 0 0 / .35); }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: .08em; }
  ol { margin: 0; padding-inline-start: 1.2em; text-align: start; color: #d9dbe0; }
  li { margin-bottom: 6px; }
  a.btn { display: inline-block; padding: 12px 22px; border-radius: 14px; background: #d97757; color: #1f1e1d; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>AIM</h1>
  <ol>
    <li>לוחצים על כפתור השיתוף של Safari.</li>
    <li>בוחרים "הוסף למסך הבית".</li>
    <li>מכבים את "Open as Web App" ולוחצים "הוסף".</li>
  </ol>
  <a class="btn" href="https://claude.ai/artifact/1H9qqRjCkBnbn1rjvxju5d">פתח את הצ'אט</a>
</main>
<script>
  // Make the address that "Add to Home Screen" saves open the chat directly next time.
  try { history.replaceState(null, "", location.pathname + "?launch=1"); } catch (e) {}
</script>
</body>
</html>
