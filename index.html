<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIM</title>
<meta name="apple-mobile-web-app-title" content="AIM">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#262624">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Noto+Serif+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: a one-screen chat with Claude: slim header with live dot, flowing assistant text, user bubbles, composer docked below */
:root {
  --bg: #faf9f5; --surface: #ffffff; --ink: #1f1e1d; --muted: #75736c; --line: #e4e0d5; --bubble: #efebe1;
  --spark: #d97757; --accent: #c96442; --accent-ink: #ffffff; --code: #f1eee6; --live: #22a55a;
  --warn: #b3322b; --warn-soft: #fbe9e6;
  --font-ui: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --font-reply: "Noto Serif Hebrew", "IBM Plex Sans Hebrew", Georgia, serif;
  --font-mono: ui-monospace, Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --surface: #30302e; --ink: #ece9e1; --muted: #a29f96; --line: #3e3d3a; --bubble: #141413;
    --accent: #d97757; --accent-ink: #1f1e1d; --code: #1c1c1a; --live: #3ccf78; --warn: #f08a83; --warn-soft: #3a1f1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --surface: #30302e; --ink: #ece9e1; --muted: #a29f96; --line: #3e3d3a; --bubble: #141413;
  --accent: #d97757; --accent-ink: #1f1e1d; --code: #1c1c1a; --live: #3ccf78; --warn: #f08a83; --warn-soft: #3a1f1e;
  color-scheme: dark;
}
:root[data-model="gpt"] { --spark: #3b82f6; --accent: #2563eb; }
@media (prefers-color-scheme: dark) {
  :root[data-model="gpt"]:not([data-theme="light"]) {
    --bg: #000000; --surface: #111111; --line: #262626; --bubble: #1c1c1e; --accent: #3b82f6; --accent-ink: #ffffff; --code: #151515;
  }
}
:root[data-model="gpt"][data-theme="dark"] {
  --bg: #000000; --surface: #111111; --line: #262626; --bubble: #1c1c1e; --accent: #3b82f6; --accent-ink: #ffffff; --code: #151515;
}
.logo-btn { border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 8px; -webkit-tap-highlight-color: transparent; }
.logo-btn:focus-visible { outline: 2px solid var(--spark); outline-offset: 3px; }
*, *::before, *::after { box-sizing: border-box; }
html { direction: rtl; }
html[lang="en"] { direction: ltr; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.55;
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.wrap { width: 100%; max-width: 720px; margin-inline: auto; padding-inline: 16px; }
.logo { display: inline-grid; place-items: center; color: var(--spark); flex: none; }
.logo svg { width: 100%; height: 100%; display: block; }

/* login */
.login { flex: 1; display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
.login-card { width: 100%; max-width: 360px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.login-card .logo { width: 48px; height: 48px; }
.login-card h1 { margin: 0; font-size: 1.1rem; letter-spacing: .14em; color: var(--muted); }
.login-card p { margin: 0; color: var(--muted); font-size: .92rem; }
.field { width: 100%; height: 46px; padding-inline: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; direction: ltr; text-align: left; }
.btn-main { width: 100%; height: 46px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-link { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: .88rem; }
.login-msg { font-size: .88rem; }
.login-msg.err { color: var(--warn); }

/* header */
header { flex: none; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.bar .logo { width: 28px; height: 28px; }
.who { display: grid; line-height: 1.25; min-width: 0; }
.who .name { font-weight: 600; font-size: 1.02rem; }
.sub { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); min-width: 0; }
.sub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; opacity: .6; }
.dot[data-s="live"] { background: var(--live); opacity: 1; }
.dot[data-s="live"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--live); animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.actions { margin-inline-start: auto; display: flex; gap: 2px; flex: none; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--bubble); color: var(--ink); }
.icon-btn svg { width: 21px; height: 21px; }
.sheet { border-top: 1px solid var(--line); background: var(--surface); max-height: 75vh; overflow-y: auto; }
.sheet-in { display: grid; gap: 14px; justify-items: center; padding-block: 16px; text-align: center; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.lang-label { font-size: .78rem; color: var(--muted); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn-plain { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: .88rem; }
.btn-warn { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--warn); background: transparent; color: var(--warn); font-weight: 600; font-size: .88rem; }
.convs { display: grid; gap: 4px; width: 100%; max-width: 480px; text-align: start; }
.conv { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); width: 100%; text-align: start; }
.conv[aria-current="true"] { border-color: var(--spark); }
.conv b { font-weight: 600; font-size: .95rem; }
.conv span { font-size: .78rem; color: var(--muted); }
.sheet h2 { margin: 0; font-size: .9rem; font-weight: 600; }
.oldbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-block: 8px 12px; padding: 10px 14px; border-radius: 16px; background: var(--bubble); font-size: .88rem; }
.oldbar button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .85rem; }
.alert { padding: 8px 12px; margin-bottom: 10px; border-radius: 10px; font-size: .85rem; background: var(--warn-soft); color: var(--warn); }

/* thread */
main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.thread { display: flex; flex-direction: column; gap: 6px; padding-block: 20px 8px; }
.row { display: grid; gap: 3px; min-width: 0; }
.row.me { justify-items: start; margin-block: 10px 4px; }
.ububble { max-width: 85%; padding: 9px 14px; border-radius: 18px; background: var(--bubble); white-space: pre-wrap; overflow-wrap: anywhere; }
.ufoot { font-size: .72rem; color: var(--muted); padding-inline: 6px; }
.ufoot .read { color: var(--live); }
.row.ai { grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.row.ai .logo { width: 22px; height: 22px; margin-top: 4px; }
.row.ai.cont .logo { visibility: hidden; }
.reply { font-family: var(--font-reply); font-size: 1.02rem; line-height: 1.75; overflow-wrap: anywhere; min-width: 0; }
.reply > :first-child { margin-top: 0; }
.reply > :last-child { margin-bottom: 0; }
.reply p { margin: 0 0 .7em; }
.reply ul, .reply ol { margin: 0 0 .7em; padding-inline-start: 1.3em; }
.reply li { margin-bottom: .25em; }
.reply h4 { margin: .9em 0 .4em; font-family: var(--font-ui); font-size: 1rem; font-weight: 600; }
.reply strong { font-weight: 600; }
.reply a { color: var(--accent); text-underline-offset: 2px; }
.reply code { font-family: var(--font-mono); font-size: .85em; background: var(--code); padding: .1em .35em; border-radius: 5px; direction: ltr; unicode-bidi: isolate; }
.reply pre { margin: 0 0 .7em; padding: 10px 12px; background: var(--code); border-radius: 10px; overflow-x: auto; direction: ltr; text-align: left; }
.reply pre code { background: none; padding: 0; font-size: .82rem; line-height: 1.5; }
.afoot { grid-column: 2; font-size: .72rem; color: var(--muted); }
.ai .pics { grid-column: 2; }
.sys { align-self: center; text-align: center; font-size: .78rem; color: var(--muted); padding: 6px 12px; margin-block: 8px; }
.pics { display: flex; flex-wrap: wrap; gap: 6px; max-width: 85%; }
.pics a { display: block; width: min(220px, 60vw); max-width: 100%; min-height: 80px; border-radius: 14px; overflow: hidden; background: var(--bubble); }
.pics img { width: 100%; height: auto; display: block; }
.tail { display: grid; gap: 10px; padding-block: 4px 24px; }
.thinking { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; align-items: center; }
.thinking .logo { width: 22px; height: 22px; animation: spin 2.6s cubic-bezier(.5, 0, .5, 1) infinite; }
.think-txt { display: grid; line-height: 1.35; min-width: 0; }
.shimmer { font-weight: 500; width: fit-content; background: linear-gradient(90deg, var(--muted) 0%, var(--ink) 45%, var(--muted) 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.8s linear infinite; }
.activity { font-size: .82rem; color: var(--muted); }
.pending { justify-self: start; font-size: .78rem; color: var(--muted); padding-inline: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -120% 0; } }
.empty { margin-block: 12vh 0; display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--muted); }
.empty .logo { width: 44px; height: 44px; }
.empty .brand { font-size: .78rem; font-weight: 600; letter-spacing: .12em; }
.empty strong { font-family: var(--font-reply); font-size: 1.5rem; font-weight: 400; color: var(--ink); }
.empty p { margin: 0; max-width: 34ch; }

/* composer */
footer { flex: none; background: var(--bg); }
.previews { display: flex; gap: 8px; padding-top: 8px; overflow-x: auto; }
.thumb { position: relative; flex: none; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--bubble); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-x { position: absolute; top: 3px; inset-inline-end: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .6); color: #fff; font-size: 15px; line-height: 1; display: grid; place-items: center; }
.box { display: flex; align-items: flex-end; gap: 8px; margin-block: 6px 12px; padding: 8px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: 0 1px 6px rgb(0 0 0 / .05); }
textarea { flex: 1; min-width: 0; resize: none; max-height: 38vh; min-height: 40px; border: 0; outline: 0; padding: 8px; background: transparent; color: var(--ink); font: inherit; line-height: 1.45; }
textarea:focus, textarea:focus-visible { outline: none; box-shadow: none; }
.attach { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; display: grid; place-items: center; background: transparent; color: var(--muted); }
.attach svg { width: 22px; height: 22px; }
.send { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.send svg { width: 18px; height: 18px; }
.send:disabled { opacity: .35; cursor: default; }
.err { padding-bottom: 8px; font-size: .82rem; color: var(--warn); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .shimmer { color: var(--muted); background: none; } }
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <span class="logo" data-logo></span>
    <h1>AIM</h1>
    <p data-t="loginLead"></p>
    <input class="field" id="email" type="email" autocomplete="username" placeholder="email" required>
    <input class="field" id="password" type="password" autocomplete="current-password" minlength="8" data-ph="password" required>
    <button class="btn-main" type="submit" data-t="signIn"></button>
    <button class="btn-link" type="button" id="signUpBtn" data-t="firstTime"></button>
    <div class="login-msg" id="loginMsg" hidden></div>
  </form>
</section>

<div id="app" hidden style="display:contents">
<header>
  <div class="wrap bar">
    <button class="logo logo-btn" id="modelBtn" type="button"></button>
    <div class="who">
      <span class="name" id="modelName">Claude</span>
      <span class="sub"><i class="dot" id="dot" data-s="off"></i><span id="sub"></span></span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="newBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="convBtn" type="button" aria-expanded="false" aria-controls="convSheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10h7M8.5 13.5h4.5"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button"></button>
      <button class="icon-btn" id="gear" type="button" aria-expanded="false" aria-controls="sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap"><div class="alert" id="alert" hidden></div></div>
  <div class="sheet" id="convSheet" hidden>
    <div class="wrap sheet-in">
      <h2 data-t="convsTitle"></h2>
      <div class="convs" id="convList"></div>
    </div>
  </div>
  <div class="sheet" id="sheet" hidden>
    <div class="wrap sheet-in">
      <div class="meta" id="meta"></div>
      <span class="lang-label" data-t="language"></span>
      <div class="seg" role="group" id="langSeg">
        <button type="button" id="lang-he" lang="he">עברית</button>
        <button type="button" id="lang-en" lang="en">English</button>
      </div>
      <div class="row-btns">
        <button class="btn-warn" id="pauseBtn" type="button"></button>
        <button class="btn-plain" id="signOutBtn" type="button" data-t="signOut"></button>
      </div>
    </div>
  </div>
</header>

<main id="scroller">
  <div class="wrap">
    <div class="thread" id="thread"></div>
    <div class="tail" id="tail"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="oldbar" id="oldbar" hidden><span data-t="oldConv"></span><button type="button" id="backCurrent" data-t="backCurrent"></button></div>
    <div class="previews" id="previews" hidden></div>
    <form class="box" id="form">
      <button class="attach" id="attach" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>
      </button>
      <input type="file" id="filePick" accept="image/*" multiple hidden>
      <textarea id="composer" rows="1"></textarea>
      <button class="send" id="send" type="submit" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="err" id="err" hidden></div>
  </div>
</footer>
</div>

      row.append(f); thread.append(row); prevAi = false; continue;
    }
    const row = el("div", "row ai" + (prevAi ? " cont" : ""));
    row.append(logoEl());
    const body = el("div", "reply"); body.innerHTML = md(m.text); row.append(body);
    if (imgs.length) row.append(picsEl(imgs));
    row.append(el("div", "afoot", stamp(m.ts)));
    thread.append(row); prevAi = true;
    if (!firstLoad && !known.has(m.id)) animate.push(body);
  }
  msgs.forEach((m) => known.add(m.id));
  firstLoad = false;
  if (stick) toBottom();
  animate.forEach((b) => typeOut(b, stick));
}
function typeOut(node, stick) {
  if (reduceMotion) return;
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  const parts = []; let n;
  while ((n = walker.nextNode())) { parts.push([n, n.nodeValue]); n.nodeValue = ""; }
  const total = parts.reduce((a, p) => a + p[1].length, 0);
  const dur = Math.min(2600, Math.max(350, total * 12)), start = performance.now();
  const step = (ts) => {
    let k = Math.ceil(total * Math.min(1, (ts - start) / dur));
    for (const [tn, full] of parts) { const take = Math.min(k, full.length); tn.nodeValue = full.slice(0, take); k -= take; }
    if (stick) toBottom();
    if (ts - start < dur) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderTail() {
  const stick = near();
  const tail = $("tail"); tail.replaceChildren();
  const c = conn();
  if (msgs.some((m) => m.sender === "me" && !m.seen && !m.pending)) {
    const key = { paused: "pPaused", offline: "pOffline", working: "pWorking" }[c] || "pLive";
    tail.append(el("div", "pending", t(key)));
  }
  if (c === "working") {
    const row = el("div", "thinking"); row.append(logoEl());
    const tx = el("div", "think-txt");
    tx.append(el("span", "shimmer", t("thinking")));
    if (curS().activity) tx.append(el("span", "activity", curS().activity));
    row.append(tx); tail.append(row);
  }
  if (stick) toBottom();
}
function renderAll() { renderHeader(); renderThread(); renderTail(); }

/* ---------- data ---------- */
function upsertMsg(row) {
  const i = msgs.findIndex((m) => m.id === row.id);
  if (i >= 0) msgs[i] = row; else msgs.push(row);
  msgs.sort((a, b) => a.ts - b.ts);
}
function applyControl(row) {
  if (!row) return;
  if (row.id === "settings") {
    settings = row.data || {};
    if ((settings.lang === "he" || settings.lang === "en") && settings.lang !== lang) setLang(settings.lang, false);
  }
  if (row.id === "status") statuses.claude = row.data || {};
  if (row.id === "status-gpt") statuses.gpt = row.data || {};
  if (row.id === "watcher") watchers.claude = row.data || {};
  if (row.id === "watcher-gpt") watchers.gpt = row.data || {};
  if (row.id === "current") {
    const d = row.data || {};
    curByModel.claude = d.conv || null; curByModel.gpt = d.gpt || null;
    const next = curByModel[model];
    if (next && next !== currentConv) {
      const follow = !viewConv || viewConv === currentConv;
      currentConv = next;
      if (follow && signedIn && !booting) { viewConv = next; loadMessages(); }
    }
  }
}
let booting = false;
async function loadConvs() {
  const { data, error } = await sb.from("conversations").select("*").order("created_at", { ascending: false });
  if (!error) convs = data || [];
  renderConvs();
}
async function loadMessages() {
  if (!viewConv && model === "gpt") { msgs = []; firstLoad = true; renderAll(); renderOldBar(); return; }
  let q = sb.from("messages").select("*").order("ts", { ascending: false }).limit(300);
  if (viewConv) q = q.eq("conv", viewConv);
  const { data, error } = await q;
  if (!error) { msgs = (data || []).reverse(); firstLoad = true; }
  renderAll(); renderOldBar();
}
async function loadAll() {
  booting = true;
  const c = await sb.from("control").select("*");
  if (!c.error) (c.data || []).forEach(applyControl);
  booting = false;
  ready = true;
  if (!viewConv) viewConv = currentConv;
  await Promise.all([loadConvs(), loadMessages()]);
}
function renderConvs() {
  const list = $("convList"); list.replaceChildren();
  convs.filter((cv) => cv.id.startsWith("g") === (model === "gpt")).forEach((cv) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "conv";
    b.setAttribute("aria-current", String(cv.id === viewConv));
    const when = new Date(cv.created_at).toLocaleDateString(t("locale"), { day: "numeric", month: "numeric", year: "2-digit" });
    b.append(el("b", null, cv.title || t("untitled")), el("span", null, [when, cv.project, cv.id === currentConv ? t("currentTag") : ""].filter(Boolean).join(" · ")));
    b.onclick = () => { viewConv = cv.id; $("convSheet").hidden = true; $("convBtn").setAttribute("aria-expanded", "false"); loadMessages(); renderConvs(); };
    list.append(b);
  });
}
function renderOldBar() {
  const old = !!(viewConv && currentConv && viewConv !== currentConv);
  $("oldbar").hidden = !old; $("form").hidden = old;
}
$("backCurrent").onclick = () => { viewConv = currentConv; loadMessages(); renderConvs(); };
let channel = null;
function subscribe() {
  if (channel) return;
  channel = sb.channel("aim")
    .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, (p) => {
      if (p.eventType === "DELETE") msgs = msgs.filter((m) => m.id !== p.old.id);
      else if (viewConv ? (!p.new.conv || p.new.conv === viewConv) : model !== "gpt") upsertMsg(p.new);
      renderThread(); renderTail();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "conversations" }, () => loadConvs())
    .on("postgres_changes", { event: "*", schema: "public", table: "control" }, (p) => {
      if (p.new) applyControl(p.new);
      renderHeader(); renderTail();
    })
    .subscribe();
}
async function saveSettings(patch) {
  settings = Object.assign({}, settings, patch);
  renderHeader();
  const { error } = await sb.from("control").upsert({ id: "settings", data: settings, updated_at: new Date().toISOString() });
  if (error) showErr(t("sendErr"));
}

/* ---------- settings sheet ---------- */
$("gear").onclick = () => { const open = $("sheet").hidden; $("sheet").hidden = !open; $("gear").setAttribute("aria-expanded", String(open)); $("convSheet").hidden = true; $("convBtn").setAttribute("aria-expanded", "false"); };
$("convBtn").onclick = () => { const open = $("convSheet").hidden; $("convSheet").hidden = !open; $("convBtn").setAttribute("aria-expanded", String(open)); $("sheet").hidden = true; $("gear").setAttribute("aria-expanded", "false"); if (open) loadConvs(); };
$("pauseBtn").onclick = () => saveSettings({ [modeKey()]: isOff() ? "on" : "off" });
$("signOutBtn").onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- composer and photos ---------- */
const ta = $("composer");
let picked = [];
const MAX_PICS = 4;
function fit() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, window.innerHeight * 0.38) + "px"; }
function syncSend() { $("send").disabled = sending || (!ta.value.trim() && !picked.length); }
function showErr(s) { const e = $("err"); e.textContent = s; e.hidden = !s; }
function shrink(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => resolve(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
function renderPicked() {
  const box = $("previews"); box.replaceChildren(); box.hidden = !picked.length;
  picked.forEach((p, i) => {
    const w = el("div", "thumb"); const im = document.createElement("img"); im.src = p.preview; im.alt = "";
    const x = el("button", "thumb-x", "×"); x.type = "button"; x.setAttribute("aria-label", t("removePic"));
    x.onclick = () => { URL.revokeObjectURL(p.preview); picked.splice(i, 1); renderPicked(); syncSend(); };
    w.append(im, x); box.append(w);
  });
}
$("attach").onclick = () => $("filePick").click();
$("filePick").addEventListener("change", async (e) => {
  const files = [...e.target.files].slice(0, MAX_PICS - picked.length);
  e.target.value = "";
  for (const f of files) { const blob = await shrink(f); picked.push({ blob, preview: URL.createObjectURL(blob) }); }
  renderPicked(); syncSend();
});
try { ta.value = localStorage.getItem("aim-draft") || ""; } catch (e) {}
ta.addEventListener("input", () => { fit(); syncSend(); try { localStorage.setItem("aim-draft", ta.value); } catch (e) {} });
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover: hover) and (pointer: fine)").matches) { e.preventDefault(); $("form").requestSubmit(); }
});
// Tapping the conversation (not the composer) closes the phone keyboard.
$("scroller").addEventListener("pointerdown", () => { if (document.activeElement === ta) ta.blur(); });

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = ta.value.trim(), pics = picked.slice();
  if ((!text && !pics.length) || sending) return;
  if (model === "gpt" && !currentConv) { showErr(t("noGptConv")); return; }
  sending = true; syncSend(); showErr("");
  const ts = Date.now();
  const id = "m" + ts.toString(36) + Math.random().toString(36).slice(2, 6);
  const row = { id, sender: "me", kind: "command", text, ts, seen: false };
  if (currentConv) row.conv = currentConv;
  const lastAi = [...msgs].reverse().find((m) => m.sender !== "me" && m.kind !== "system");
  if (lastAi && lastAi.kind === "question" && !msgs.slice(msgs.indexOf(lastAi) + 1).some((m) => m.sender === "me")) { row.kind = "answer"; row.reply_to = lastAi.id; }
  try {
    if (pics.length) {
      row.images = [];
      for (let i = 0; i < pics.length; i++) {
        const path = "me/" + id + "/" + i + ".jpg";
        const { error } = await sb.storage.from(BUCKET).upload(path, pics[i].blob, { contentType: pics[i].blob.type || "image/jpeg" });
        if (error) throw { pic: true };
        row.images.push(path);
      }
    }
    upsertMsg(Object.assign({ pending: true }, row)); renderThread(); renderTail();
    const { error } = await sb.from("messages").insert(row);
    if (error) throw error;
    upsertMsg(row);
    ta.value = ""; fit(); toBottom();
    pics.forEach((p) => URL.revokeObjectURL(p.preview)); picked = []; renderPicked();
    try { localStorage.removeItem("aim-draft"); } catch (e2) {}
  } catch (err) {
    msgs = msgs.filter((m) => !(m.id === id && m.pending));
    showErr(err && err.pic ? t("picErr") : t("sendErr"));
  }
  sending = false; syncSend(); renderThread(); renderTail();
});

/* ---------- light / dark ---------- */
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function isDark() { const th = document.documentElement.dataset.theme; return th ? th === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
function paintThemeBtn() { const d = isDark(), b = $("themeBtn"); b.innerHTML = d ? SUN : MOON; b.setAttribute("aria-label", d ? t("light") : t("dark")); }
try { const saved = localStorage.getItem("aim-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
$("themeBtn").onclick = () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("aim-theme", next); } catch (e) {}
  paintThemeBtn();
};
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintThemeBtn);

/* ---------- sign in ---------- */
function loginMsg(s, isErr) { const m = $("loginMsg"); m.textContent = s; m.className = "login-msg" + (isErr ? " err" : ""); m.hidden = !s; }
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); loginMsg("");
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) loginMsg(t("loginErr"), true);
});
$("signUpBtn").onclick = async () => {
  loginMsg("");
  if (!$("loginForm").reportValidity()) return;
  const { error } = await sb.auth.signUp({ email: $("email").value.trim(), password: $("password").value, options: { emailRedirectTo: location.origin + location.pathname } });
  loginMsg(error ? error.message : t("signUpDone"), !!error);
};

function showApp(on) {
  $("login").hidden = on; $("app").hidden = !on;
  if (on && !signedIn) { signedIn = true; loadAll(); subscribe(); }
}
sb.auth.onAuthStateChange((_ev, session) => showApp(!!session));

/* ---------- boot ---------- */
applyLang(); fit(); syncSend();
sb.auth.getSession().then(({ data }) => showApp(!!(data && data.session)));
setInterval(() => { renderHeader(); renderTail(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && signedIn) loadAll(); });
</script>
